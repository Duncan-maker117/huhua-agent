name: Tests

permissions:
  contents: read

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend tests
      - run: python scripts/run_tests.py -v
