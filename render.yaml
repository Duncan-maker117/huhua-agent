services:
  - type: web
    name: huhua-agent
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: REQUIRE_ACCOUNT
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: ALLOW_INSECURE_LOCAL_STORAGE
        value: "false"
      - key: APP_ORIGIN
        sync: false
      - key: DATA_ENCRYPTION_KEYS
        sync: false
      - key: DATA_ENCRYPTION_ACTIVE_KEY
        sync: false
      - key: ACCOUNT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: huhua-agent-db
          property: connectionString
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL
        value: qwen-plus
      - key: LLM_STRUCTURED_MODEL
        value: qwen-plus

databases:
  - name: huhua-agent-db
    plan: free
    region: singapore
